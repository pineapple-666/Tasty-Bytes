name: dbt CI/CD

on:
  # CI — runs on every pull request
  pull_request:
    branches: [main]

  # CD — runs when a PR is merged into main
  push:
    branches: [main]

  # SCHEDULED REFRESH — runs every day at 02:00 UTC
  # To pause: comment out these two lines.
  # To resume: uncomment them and push.
  schedule:
    - cron: '0 2 * * *'

  # MANUAL TRIGGER — run from GitHub UI → Actions → "Run workflow"
  workflow_dispatch:
    inputs:
      target:
        description: 'dbt target (dev or prod)'
        required: false
        default: 'prod'

env:
  DBT_PROFILES_DIR: .   # tells dbt to look for profiles.yml in the repo root

jobs:
  # ---------------------------------------------------------------------------
  # CI JOB — pull requests only
  # Compiles and tests only the models that changed on this branch.
  # Does NOT write to prod.
  # ---------------------------------------------------------------------------
  ci:
    name: CI — compile & test changed models
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    env:
      SNOWFLAKE_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER:      ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD:  ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE:      ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE:  ${{ secrets.SNOWFLAKE_DATABASE }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt-snowflake
        run: pip install dbt-snowflake

      - name: Write profiles.yml from secrets
        run: |
          cat > profiles.yml <<EOF
          tasty_bytes:
            outputs:
              dev:
                type: snowflake
                account: "$SNOWFLAKE_ACCOUNT"
                user: "$SNOWFLAKE_USER"
                password: "$SNOWFLAKE_PASSWORD"
                role: "$SNOWFLAKE_ROLE"
                database: "$SNOWFLAKE_DATABASE"
                warehouse: "$SNOWFLAKE_WAREHOUSE"
                schema: DBT_CI_${{ github.event.pull_request.number }}
                threads: 4
            target: dev
          EOF

      - name: dbt deps
        run: dbt deps

      - name: dbt compile (syntax check)
        run: dbt compile

      - name: dbt run (changed models + downstream)
        run: dbt run --select state:modified+

      - name: dbt test (changed models + downstream)
        run: dbt test --select state:modified+

  # ---------------------------------------------------------------------------
  # CD JOB — merge to main only
  # Runs the full pipeline against the prod target.
  # ---------------------------------------------------------------------------
  cd:
    name: CD — deploy to prod
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      SNOWFLAKE_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER:      ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD:  ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE:      ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE:  ${{ secrets.SNOWFLAKE_DATABASE }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt-snowflake
        run: pip install dbt-snowflake

      - name: Write profiles.yml from secrets
        run: |
          cat > profiles.yml <<EOF
          tasty_bytes:
            outputs:
              prod:
                type: snowflake
                account: "$SNOWFLAKE_ACCOUNT"
                user: "$SNOWFLAKE_USER"
                password: "$SNOWFLAKE_PASSWORD"
                role: "$SNOWFLAKE_ROLE"
                database: "$SNOWFLAKE_DATABASE"
                warehouse: "$SNOWFLAKE_WAREHOUSE"
                schema: DBT_PROD
                threads: 8
            target: prod
          EOF

      - name: dbt deps
        run: dbt deps

      - name: dbt run (full pipeline)
        run: dbt run --target prod

      - name: dbt test (full test suite)
        run: dbt test --target prod

  # ---------------------------------------------------------------------------
  # SCHEDULED REFRESH JOB — daily cron or manual trigger
  # Refreshes all gold tables so analysts always see yesterday's data.
  # ---------------------------------------------------------------------------
  scheduled-refresh:
    name: Daily refresh (prod)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    env:
      SNOWFLAKE_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER:      ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD:  ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE:      ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE:  ${{ secrets.SNOWFLAKE_DATABASE }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt-snowflake
        run: pip install dbt-snowflake

      - name: Write profiles.yml from secrets
        run: |
          TARGET=${{ github.event.inputs.target || 'prod' }}
          cat > profiles.yml <<EOF
          tasty_bytes:
            outputs:
              prod:
                type: snowflake
                account: "$SNOWFLAKE_ACCOUNT"
                user: "$SNOWFLAKE_USER"
                password: "$SNOWFLAKE_PASSWORD"
                role: "$SNOWFLAKE_ROLE"
                database: "$SNOWFLAKE_DATABASE"
                warehouse: "$SNOWFLAKE_WAREHOUSE"
                schema: DBT_PROD
                threads: 8
            target: "$TARGET"
          EOF

      - name: dbt deps
        run: dbt deps

      - name: dbt run — refresh all models
        run: dbt run --target ${{ github.event.inputs.target || 'prod' }}

      - name: dbt test — validate after refresh
        run: dbt test --target ${{ github.event.inputs.target || 'prod' }}
