name: dbt CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'dbt target (dev or prod)'
        required: false
        default: 'prod'

env:
  DBT_PROFILES_DIR: ./tasty_bytes_dbt

jobs:
  # ---------------------------------------------------------------------------
  # CI — pull requests only: compile & test changed models in an isolated schema
  # ---------------------------------------------------------------------------
  ci:
    name: CI — compile & test changed models
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tasty_bytes_dbt

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt-snowflake
        run: pip install dbt-snowflake

      - name: Write private key
        run: echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/rsa_key.pem

      - name: Write profiles.yml
        run: |
          cat > profiles.yml <<EOF
          tasty_bytes:
            outputs:
              dev:
                type: snowflake
                account: "${{ secrets.SNOWFLAKE_ACCOUNT }}"
                user: "${{ secrets.SNOWFLAKE_USER }}"
                private_key_path: /tmp/rsa_key.pem
                role: "${{ secrets.SNOWFLAKE_ROLE }}"
                database: "${{ secrets.SNOWFLAKE_DATABASE }}"
                warehouse: "${{ secrets.SNOWFLAKE_WAREHOUSE }}"
                schema: DBT_CI_${{ github.event.pull_request.number }}
                threads: 4
            target: dev
          EOF

      - name: dbt deps
        run: dbt deps

      - name: dbt compile
        run: dbt compile

      - name: dbt run (changed models + downstream)
        run: dbt run --select state:modified+

      - name: dbt test (changed models + downstream)
        run: dbt test --select state:modified+

  # ---------------------------------------------------------------------------
  # CD — merge to main: full pipeline to prod
  # ---------------------------------------------------------------------------
  cd:
    name: CD — deploy to prod
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tasty_bytes_dbt

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt-snowflake
        run: pip install dbt-snowflake

      - name: Write private key
        run: echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/rsa_key.pem

      - name: Write profiles.yml
        run: |
          cat > profiles.yml <<EOF
          tasty_bytes:
            outputs:
              prod:
                type: snowflake
                account: "${{ secrets.SNOWFLAKE_ACCOUNT }}"
                user: "${{ secrets.SNOWFLAKE_USER }}"
                private_key_path: /tmp/rsa_key.pem
                role: "${{ secrets.SNOWFLAKE_ROLE }}"
                database: "${{ secrets.SNOWFLAKE_DATABASE }}"
                warehouse: "${{ secrets.SNOWFLAKE_WAREHOUSE }}"
                schema: DBT_PROD
                threads: 8
            target: prod
          EOF

      - name: dbt deps
        run: dbt deps

      - name: dbt run (full pipeline)
        run: dbt run --target prod

      - name: dbt test (full test suite)
        run: dbt test --target prod

  # ---------------------------------------------------------------------------
  # Scheduled / manual refresh — daily cron keeps gold tables fresh
  # ---------------------------------------------------------------------------
  scheduled-refresh:
    name: Daily refresh (prod)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tasty_bytes_dbt

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt-snowflake
        run: pip install dbt-snowflake

      - name: Write private key
        run: echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/rsa_key.pem

      - name: Write profiles.yml
        run: |
          TARGET=${{ github.event.inputs.target || 'prod' }}
          cat > profiles.yml <<EOF
          tasty_bytes:
            outputs:
              prod:
                type: snowflake
                account: "${{ secrets.SNOWFLAKE_ACCOUNT }}"
                user: "${{ secrets.SNOWFLAKE_USER }}"
                private_key_path: /tmp/rsa_key.pem
                role: "${{ secrets.SNOWFLAKE_ROLE }}"
                database: "${{ secrets.SNOWFLAKE_DATABASE }}"
                warehouse: "${{ secrets.SNOWFLAKE_WAREHOUSE }}"
                schema: DBT_PROD
                threads: 8
            target: "$TARGET"
          EOF

      - name: dbt deps
        run: dbt deps

      - name: dbt run
        run: dbt run --target ${{ github.event.inputs.target || 'prod' }}

      - name: dbt test
        run: dbt test --target ${{ github.event.inputs.target || 'prod' }}
